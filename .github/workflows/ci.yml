name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: macro_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: macro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macro_test -d macro_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://macro_test:ephemeral_ci_only@localhost:5432/macro_test
      DATABASE_URL: postgresql://macro_test:ephemeral_ci_only@localhost:5432/macro_test
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen pytest --cov --cov-report=xml -q
      - run: uv run --frozen macro --root data_demo demo
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation
          path: |
            coverage.xml
            dbt/target/run_results.json
            dist/*
