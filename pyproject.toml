[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peru-macro-data-platform"
version = "0.1.0"
description = "Revision-aware BCRP data platform with PostgreSQL history and tested dbt publication"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Neil Borjas Ramos"}]
dependencies = ["requests==2.32.5", "psycopg[binary]==3.2.6", "dbt-core==1.9.8", "dbt-postgres==1.9.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1", "ruff==0.14.2"]
analysis = ["matplotlib==3.10.8"]

[project.scripts]
macro = "peru_macro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peru_macro = ["sql/*.sql", "catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["peru_macro"]

[tool.coverage.report]
show_missing = true
