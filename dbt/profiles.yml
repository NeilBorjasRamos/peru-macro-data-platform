peru_macro:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'macro') }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      dbname: "{{ env_var('PGDATABASE', 'macro') }}"
      schema: "{{ env_var('DBT_BUILD_SCHEMA', 'macro_dev') }}"
      sslmode: "{{ env_var('PGSSLMODE', 'prefer') }}"
      threads: 1
